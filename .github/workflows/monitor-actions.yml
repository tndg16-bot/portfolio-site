name: Monitor GitHub Actions Errors

on:
  schedule:
    # 毎時実行（JST）
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor Failed Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor failed workflows
        id: monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 監視スクリプトの実行
          node .github/scripts/monitor-workflows.js

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 206,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ Monitor workflow failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            })
